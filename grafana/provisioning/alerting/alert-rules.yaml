apiVersion: 1
groups:
  - orgId: 1
    name: observability-demo
    folder: DevOps IA Alerts
    interval: 10s
    rules:
      - uid: high-cpu-usage
        title: High CPU Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[1m])) * 100)"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
        for: 30s
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
          team: devops
        annotations:
          summary: "CPU usage is above 80%"
          description: "Host CPU usage is {{ printf \"%.1f\" $values.B.Value }}% (threshold 80%) for more than 30 seconds."
          __dashboardUid__: system-overview
          __panelId__: "1"
        isPaused: false
      - uid: high-memory-usage
        title: High Memory Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: "(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
        for: 1m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "Memory usage is above 90%"
          description: "Host memory usage is {{ printf \"%.1f\" $values.B.Value }}% (threshold 90%) for more than 1 minute."
          __dashboardUid__: system-overview
          __panelId__: "2"
        isPaused: false
      - uid: low-disk-space
        title: Low Disk Space
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: "max(100 - (node_filesystem_avail_bytes{mountpoint=~\"/|/var/lib/docker\",fstype!~\"tmpfs|overlay|squashfs|erofs|fakeowner|selfowner|virtiofs.*|fuse.*\"} / node_filesystem_size_bytes{mountpoint=~\"/|/var/lib/docker\",fstype!~\"tmpfs|overlay|squashfs|erofs|fakeowner|selfowner|virtiofs.*|fuse.*\"} * 100))"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
        for: 1m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "Root filesystem is more than 90% full"
          description: "Root disk usage is {{ printf \"%.1f\" $values.B.Value }}% (threshold 90%)."
          __dashboardUid__: system-overview
          __panelId__: "3"
        isPaused: false
      - uid: high-error-rate
        title: High HTTP Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: "100 * (sum(rate(http_requests_total{status=~\"5..\"}[1m])) or vector(0)) / clamp_min(sum(rate(http_requests_total[1m])), 0.001)"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
        for: 30s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          team: devops
        annotations:
          summary: "HTTP 5xx error rate is above 5%"
          description: "{{ printf \"%.1f\" $values.B.Value }}% of HTTP requests are failing with 5xx (threshold 5%)."
          __dashboardUid__: app-performance
          __panelId__: "3"
        isPaused: false
      - uid: high-p95-latency
        title: High p95 Latency
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[1m])))"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
        for: 30s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "p95 latency is above 1 second"
          description: "p95 request latency is {{ printf \"%.2f\" $values.B.Value }}s (threshold 1s). Click an exemplar on the latency panel to open the slow trace in Tempo."
          __dashboardUid__: app-performance
          __panelId__: "8"
        isPaused: false
      - uid: service-down
        title: Service Down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: "up{job=~\"store-api|inventory-service\"}"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        for: 15s
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
          team: devops
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }})."
          __dashboardUid__: app-performance
          __panelId__: "1"
        isPaused: false
